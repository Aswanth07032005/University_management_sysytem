{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MMT Medical College</title>


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        :root{
            --navy-dark:#0B2C5C;
            --navy:#16407E;
            --blue-pale:#EEF3FB;
            --blue-line:#D3DFF0;
            --gold:#C9A227;
            --ink:#1C2430;
            --muted:#5B6474;
        }

        body {
            background: var(--blue-pale);
            min-height: 100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:"Inter","Segoe UI",system-ui,sans-serif;
            color:var(--ink);
            padding:24px;
        }

        .login-card {
            width:420px;
            max-width:100%;
            border:none;
            border-radius:14px;
            box-shadow:0 24px 50px -28px rgba(11,44,92,0.4);
            overflow:hidden;
        }

        .login-header {
            background:linear-gradient(135deg,var(--navy-dark),var(--navy));
            color:#fff;
            padding:34px 30px 28px;
            text-align:center;
            position:relative;
        }

        .login-header::after{
            content:"";
            position:absolute;
            left:0; right:0; bottom:0;
            height:4px;
            background:var(--gold);
        }

        .login-header .crest-badge{
            width:56px;
            height:56px;
            margin:0 auto 14px;
            border:1.5px solid rgba(244,197,66,0.6);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .login-header i.fa-building-columns {
            font-size:26px;
            color:var(--gold);
        }

        .login-header .eyebrow{
            margin:0 0 4px;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:0.14em;
            color:#B9CBEA;
            font-weight:600;
        }

        .login-header h3 {
            margin:0;
            font-family:"Georgia","Times New Roman",serif;
            font-weight:600;
            font-size:22px;
        }

        .login-header p {
            font-size:13px;
            color:#C7D6EE;
            margin:4px 0 0;
        }

        .card-body{
            padding:32px 30px 28px;
        }

        .form-label{
            font-size:13px;
            font-weight:600;
            color:var(--ink);
        }

        .form-control {
            height:45px;
            border-radius:8px;
            border:1px solid #C7D2E3;
            background:#FBFCFE;
        }

        .form-control:focus{
            border-color:var(--navy);
            box-shadow:0 0 0 3px rgba(22,64,126,0.14);
        }

        .input-group-text {
            background:var(--blue-pale);
            border:1px solid #C7D2E3;
            border-right:none;
            color:var(--navy);
        }

        .input-group .form-control{
            border-left:none;
        }

        .btn-login {
            height:46px;
            border-radius:8px;
            background:var(--navy-dark);
            color:white;
            font-weight:700;
            letter-spacing:0.02em;
            border:none;
            transition:background .15s ease, transform .1s ease;
        }

        .btn-login:hover {
            background:var(--navy);
            color:white;
        }

        .btn-login:active{
            transform:translateY(1px);
        }

        .alert-danger{
            border-radius:8px;
            font-size:13.5px;
        }

        /* ---- Register links redesigned as a row of quiet buttons ---- */
        .register-divider{
            display:flex;
            align-items:center;
            gap:12px;
            margin:28px 0 16px;
            color:var(--muted);
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:0.08em;
        }

        .register-divider::before,
        .register-divider::after{
            content:"";
            flex:1;
            height:1px;
            background:var(--blue-line);
        }

        .register-links{
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .register-links a{
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 14px;
            border:1px solid var(--blue-line);
            border-radius:8px;
            background:var(--blue-pale);
            color:var(--ink) !important;
            font-size:13.5px;
            font-weight:600;
            text-decoration:none;
            transition:border-color .15s ease, background .15s ease;
        }

        .register-links a i{
            color:var(--navy);
            width:16px;
            text-align:center;
        }

        .register-links a:hover{
            border-color:var(--navy);
            background:#fff;
        }

    </style>


</head>


<body>


<div class="card login-card">


    <div class="login-header">

        <div class="crest-badge">
            <i class="fa-solid fa-building-columns"></i>
        </div>

        <p class="eyebrow">MM Technical University</p>

        <h3>
            University Login
        </h3>

        <p class="mb-0">
            Admission Management System
        </p>

    </div>



    <div class="card-body">



        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}




        <form method="POST">

            {% csrf_token %}



            <div class="mb-3">


                <label class="form-label">
                    Username
                </label>


                <div class="input-group">

                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>


                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter Username"
                           required>


                </div>


            </div>





            <div class="mb-3">


                <label class="form-label">
                    Password
                </label>



                <div class="input-group">


                    <span class="input-group-text">

                        <i class="fa-solid fa-lock"></i>

                    </span>


                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter Password"
                           required>


                </div>


            </div>





            <button type="submit"
                    class="btn btn-login w-100">

                <i class="fa-solid fa-right-to-bracket me-2"></i>

                Login

            </button>



        </form>




        <div class="register-divider">
            New here
        </div>

        <div class="register-links">

            <a href="{% url 's_register' %}">
                <i class="fa-solid fa-user-graduate"></i>
                Student Register
            </a>

            <a href="{% url 'staff_r' %}">
                <i class="fa-solid fa-user-tie"></i>
                Staff Register
            </a>

            <a href="{% url 'college_r' %}">
                <i class="fa-solid fa-building-columns"></i>
                College Register
            </a>

        </div>



    </div>


</div>



</body>

</html>
