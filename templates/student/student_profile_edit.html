{% extends "student/student_dashboard.html" %}

{% block content %}

<style>
    :root{
        --navy-dark:#0B2C5C;
        --navy:#16407E;
        --navy-soft:#EAF0FA;
        --blue-pale:#EEF3FB;
        --blue-line:#D9E3F2;
        --gold:#C9A227;
        --ink:#1C2430;
        --muted:#6B7383;
        --error:#B23A48;
    }

    .edit-shell{
        max-width:760px;
        margin:0 auto;
    }

    .edit-card{
        background:#fff;
        border:1px solid var(--blue-line);
        border-radius:14px;
        overflow:hidden;
        box-shadow:0 18px 40px -28px rgba(11,44,92,0.35);
    }

    .edit-header{
        background:linear-gradient(120deg,var(--navy-dark),var(--navy));
        color:#fff;
        padding:26px 32px;
        display:flex;
        align-items:center;
        gap:14px;
        position:relative;
    }

    .edit-header::after{
        content:"";
        position:absolute;
        left:0; right:0; bottom:0;
        height:3px;
        background:var(--gold);
    }

    .edit-header .icon-wrap{
        width:42px; height:42px;
        border-radius:10px;
        background:rgba(255,255,255,0.14);
        border:1px solid rgba(244,197,66,0.5);
        display:flex; align-items:center; justify-content:center;
        font-size:17px;
        color:var(--gold);
        flex:none;
    }

    .edit-header h4{
        margin:0;
        font-family:"Georgia","Times New Roman",serif;
        font-weight:700;
        font-size:19px;
    }

    .edit-header p{
        margin:2px 0 0;
        font-size:12.5px;
        color:#C7D6EE;
    }

    .edit-body{
        padding:32px 32px 28px;
    }

    /* Django .as_p paragraphs */
    .edit-body form p{
        margin:0 0 18px;
        display:flex;
        flex-direction:column;
        gap:6px;
    }

    .edit-body form label{
        font-size:13px;
        font-weight:600;
        color:var(--ink);
    }

    .edit-body form input,
    .edit-body form select,
    .edit-body form textarea{
        font-family:inherit;
        font-size:14.5px;
        padding:10px 14px;
        border:1px solid #C7D2E3;
        border-radius:8px;
        background:#FBFCFE;
        color:var(--ink);
        outline:none;
        width:100%;
        box-sizing:border-box;
        transition:border-color .15s ease, box-shadow .15s ease;
    }

    .edit-body form input:focus,
    .edit-body form select:focus,
    .edit-body form textarea:focus{
        border-color:var(--navy);
        box-shadow:0 0 0 3px rgba(22,64,126,0.14);
        background:#fff;
    }

    .edit-body form input[type="checkbox"],
    .edit-body form input[type="radio"]{
        width:auto;
        accent-color:var(--navy);
    }

    .edit-body form input[type="file"]{
        padding:8px 12px;
        background:var(--blue-pale);
    }

    .edit-photo-wrap{
        width:130px;
        height:130px;
        margin:0 auto 22px;
        border-radius:50%;
        overflow:hidden;
        background:var(--navy-soft);
        border:3px solid #fff;
        box-shadow:0 0 0 1px var(--blue-line);
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .edit-photo-wrap img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
    }

    .edit-photo-wrap .fallback-icon{
        color:var(--navy);
        font-size:64px;
    }

    .edit-body .helptext{
        font-size:12px;
        color:var(--muted);
    }

    .edit-body ul.errorlist{
        list-style:none;
        margin:2px 0 0;
        padding:0;
        font-size:12.5px;
        color:var(--error);
    }

    .edit-actions{
        display:flex;
        justify-content:flex-end;
        gap:10px;
        margin-top:8px;
        padding-top:22px;
        border-top:1px solid var(--blue-line);
    }

    .btn-save{
        display:inline-flex;
        align-items:center;
        gap:8px;
        background:var(--navy-dark);
        color:#fff;
        border:none;
        font-size:13.5px;
        font-weight:600;
        padding:10px 20px;
        border-radius:8px;
        cursor:pointer;
        transition:background .15s ease, transform .1s ease;
    }

    .btn-save:hover{ background:var(--navy); color:#fff; }
    .btn-save:active{ transform:translateY(1px); }

    .btn-cancel{
        display:inline-flex;
        align-items:center;
        gap:8px;
        background:#fff;
        color:var(--muted);
        border:1px solid var(--blue-line);
        font-size:13.5px;
        font-weight:600;
        padding:10px 20px;
        border-radius:8px;
        text-decoration:none;
        transition:background .15s ease, color .15s ease;
    }

    .btn-cancel:hover{
        background:var(--blue-pale);
        color:var(--ink);
    }

    @media (max-width:576px){
        .edit-body{ padding:26px 22px 22px; }
        .edit-header{ padding:22px 22px; }
        .edit-actions{ flex-direction:column-reverse; }
        .btn-save, .btn-cancel{ justify-content:center; width:100%; }
    }
</style>

<div class="edit-shell">

    <div class="edit-card">

        <div class="edit-header">
            <div class="icon-wrap"><i class="fa-solid fa-user-pen"></i></div>
            <div>
                <h4>Edit Profile</h4>
                <p>Update your personal and academic details</p>
            </div>
        </div>

        <div class="edit-body">

            <form method="POST" enctype="multipart/form-data" novalidate>

                {% csrf_token %}

                <div class="edit-photo-wrap" id="photoPreviewWrap">
                    {% if form.instance.profile_photo %}
                        <img src="{{ form.instance.profile_photo.url }}" alt="{{ form.instance.full_name }}" id="photoPreviewImg">
                    {% else %}
                        <i class="fa-solid fa-circle-user fallback-icon" id="photoPreviewIcon"></i>
                    {% endif %}
                </div>

                {{ form.as_p }}

                <div class="edit-actions">
                    <a href="{% url 'student_profile' %}" class="btn-cancel">
                        Cancel
                    </a>

                    <button type="submit" class="btn-save">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Changes
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<script>
    (function(){
        var fileInput = document.querySelector('.edit-body form input[type="file"]');
        var wrap = document.getElementById('photoPreviewWrap');

        if (!fileInput || !wrap) return;

        fileInput.addEventListener('change', function(e){
            var file = e.target.files && e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(evt){
                wrap.innerHTML = '<img src="' + evt.target.result + '" alt="Selected photo">';
            };
            reader.readAsDataURL(file);
        });
    })();
</script>

{% endblock %}
