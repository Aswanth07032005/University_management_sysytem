<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MMT Medical College</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root{
            --navy-dark:#0B2C5C;
            --navy:#16407E;
            --navy-soft:#EAF0FA;
            --blue-pale:#EEF3FB;
            --blue-line:#D9E3F2;
            --gold:#C9A227;
            --ink:#1C2430;
            --muted:#6B7383;
            --green:#1F8A5F;
            --red:#B23A48;
            --amber:#B8791F;
            --sidebar-w:250px;
        }

        *{ box-sizing:border-box; }

        body{
            background:var(--blue-pale);
            font-family:"Inter","Segoe UI",system-ui,sans-serif;
            color:var(--ink);
        }

        /* ---------------- Sidebar ---------------- */
        .sidebar{
            position:fixed;
            top:0; left:0; bottom:0;
            width:var(--sidebar-w);
            background:linear-gradient(180deg,var(--navy-dark),#082047);
            color:#fff;
            display:flex;
            flex-direction:column;
            z-index:1030;
        }

        .sidebar-brand{
            display:flex;
            align-items:center;
            gap:12px;
            padding:22px 20px;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .sidebar-brand .crest{
            width:38px; height:38px;
            border:1.5px solid rgba(244,197,66,0.6);
            border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            flex:none;
        }

        .sidebar-brand .crest i{ color:var(--gold); font-size:16px; }

        .sidebar-brand .name{
            font-family:"Georgia",serif;
            font-size:14.5px;
            font-weight:700;
            line-height:1.25;
        }

        .sidebar-brand .name small{
            display:block;
            font-family:"Inter",sans-serif;
            font-size:10.5px;
            font-weight:500;
            letter-spacing:0.08em;
            text-transform:uppercase;
            color:#9FB3D6;
        }

        .sidebar-nav{
            padding:18px 12px;
            flex:1;
            overflow-y:auto;
        }

        .sidebar-nav .nav-section{
            font-size:10.5px;
            text-transform:uppercase;
            letter-spacing:0.1em;
            color:#7C90B6;
            font-weight:700;
            padding:14px 12px 8px;
        }

        .sidebar-nav a{
            display:flex;
            align-items:center;
            gap:12px;
            padding:10px 12px;
            border-radius:8px;
            color:#D6E0F2;
            text-decoration:none;
            font-size:13.5px;
            font-weight:500;
            margin-bottom:2px;
            transition:background .15s ease, color .15s ease;
        }

        .sidebar-nav a i{ width:18px; text-align:center; font-size:14px; }

        .sidebar-nav a:hover{
            background:rgba(255,255,255,0.06);
            color:#fff;
        }

        .sidebar-nav a.active{
            background:var(--gold);
            color:var(--navy-dark);
            font-weight:700;
        }

        .sidebar-foot{
            padding:16px 20px;
            border-top:1px solid rgba(255,255,255,0.08);
            font-size:12px;
            color:#8AA0C7;
        }

        /* ---------------- Main area ---------------- */
        .main{
            margin-left:var(--sidebar-w);
            min-height:100vh;
        }

        .topbar{
            background:#fff;
            border-bottom:1px solid var(--blue-line);
            padding:14px 28px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            position:sticky;
            top:0;
            z-index:1020;
        }

        .topbar h4{
            margin:0;
            font-family:"Georgia",serif;
            font-size:19px;
            font-weight:700;
            color:var(--navy-dark);
        }

        .topbar .breadcrumb-note{
            font-size:12px;
            color:var(--muted);
            margin:2px 0 0;
        }

        .topbar-search{
            flex:1;
            max-width:340px;
            position:relative;
        }

        .topbar-search i{
            position:absolute;
            left:14px; top:50%;
            transform:translateY(-50%);
            color:var(--muted);
            font-size:13px;
        }

        .topbar-search input{
            width:100%;
            border:1px solid var(--blue-line);
            background:var(--blue-pale);
            border-radius:20px;
            padding:9px 14px 9px 36px;
            font-size:13.5px;
            outline:none;
        }

        .topbar-search input:focus{
            border-color:var(--navy);
            background:#fff;
        }

        .topbar-actions{
            display:flex;
            align-items:center;
            gap:18px;
        }

        .icon-btn{
            position:relative;
            width:38px; height:38px;
            border-radius:50%;
            background:var(--blue-pale);
            display:flex; align-items:center; justify-content:center;
            color:var(--navy);
            font-size:14px;
        }

        .icon-btn .dot{
            position:absolute;
            top:6px; right:7px;
            width:7px; height:7px;
            border-radius:50%;
            background:var(--red);
            border:1.5px solid #fff;
        }

        .admin-chip{
            display:flex;
            align-items:center;
            gap:10px;
            padding:6px 12px 6px 6px;
            border:1px solid var(--blue-line);
            border-radius:24px;
            cursor:pointer;
        }

        .admin-chip .avatar{
            width:30px; height:30px;
            border-radius:50%;
            background:var(--navy-dark);
            color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-size:12px;
            font-weight:700;
        }

        .admin-chip .who{
            font-size:12.5px;
            line-height:1.2;
        }

        .admin-chip .who small{
            display:block;
            color:var(--muted);
            font-size:11px;
        }

        /* ---------------- Content ---------------- */
        .content{
            padding:26px 28px 40px;
        }

        .stat-card{
            background:#fff;
            border:1px solid var(--blue-line);
            border-radius:12px;
            padding:20px 22px;
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:12px;
        }

        .stat-card .label{
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:0.06em;
            color:var(--muted);
            font-weight:600;
            margin:0 0 8px;
        }

        .stat-card .value{
            font-family:"Georgia",serif;
            font-size:26px;
            font-weight:700;
            color:var(--navy-dark);
            margin:0;
        }

        .stat-card .delta{
            font-size:12px;
            margin-top:6px;
            font-weight:600;
        }

        .stat-card .delta.up{ color:var(--green); }
        .stat-card .delta.down{ color:var(--red); }

        .stat-card .icon-wrap{
            width:44px; height:44px;
            border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            font-size:17px;
            flex:none;
        }

        .icon-wrap.blue{ background:var(--navy-soft); color:var(--navy); }
        .icon-wrap.gold{ background:#FBF2DC; color:var(--amber); }
        .icon-wrap.green{ background:#E4F5EC; color:var(--green); }
        .icon-wrap.red{ background:#FBEAEC; color:var(--red); }

        .panel{
            background:#fff;
            border:1px solid var(--blue-line);
            border-radius:12px;
            padding:22px 24px;
        }

        .panel-title{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:18px;
        }

        .panel-title h6{
            margin:0;
            font-family:"Georgia",serif;
            font-size:15.5px;
            font-weight:700;
            color:var(--navy-dark);
        }

        .panel-title a{
            font-size:12.5px;
            color:var(--navy);
            text-decoration:none;
            font-weight:600;
        }

        /* Enrollment mini bar chart, CSS only */
        .bars{
            display:flex;
            align-items:flex-end;
            gap:14px;
            height:150px;
            padding-top:10px;
        }

        .bars .bar-col{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
        }

        .bars .bar{
            width:100%;
            max-width:26px;
            border-radius:6px 6px 2px 2px;
            background:var(--navy);
        }

        .bars .bar-col:nth-child(4) .bar,
        .bars .bar-col:nth-child(5) .bar{
            background:var(--gold);
        }

        .bars .bar-col span{
            font-size:11px;
            color:var(--muted);
        }

        .status-pill{
            font-size:11.5px;
            font-weight:700;
            padding:4px 10px;
            border-radius:20px;
            display:inline-block;
        }

        .status-pill.approved{ background:#E4F5EC; color:var(--green); }
        .status-pill.pending{ background:#FBF2DC; color:var(--amber); }
        .status-pill.rejected{ background:#FBEAEC; color:var(--red); }

        table.mmt-table{
            width:100%;
            border-collapse:collapse;
            font-size:13.5px;
        }

        table.mmt-table th{
            text-align:left;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:0.06em;
            color:var(--muted);
            font-weight:700;
            padding:0 10px 10px;
            border-bottom:1px solid var(--blue-line);
        }

        table.mmt-table td{
            padding:12px 10px;
            border-bottom:1px solid #F0F3F9;
            vertical-align:middle;
        }

        table.mmt-table tr:last-child td{ border-bottom:none; }

        .row-avatar{
            width:32px; height:32px;
            border-radius:50%;
            background:var(--navy-soft);
            color:var(--navy);
            display:flex; align-items:center; justify-content:center;
            font-size:12px;
            font-weight:700;
        }

        .quick-item{
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 10px;
            border-radius:8px;
            transition:background .15s ease;
        }

        .quick-item:hover{ background:var(--blue-pale); }

        .quick-item .qi-icon{
            width:36px; height:36px;
            border-radius:8px;
            background:var(--navy-soft);
            color:var(--navy);
            display:flex; align-items:center; justify-content:center;
            font-size:14px;
            flex:none;
        }

        .quick-item .qi-text p{ margin:0; font-size:13px; font-weight:600; }
        .quick-item .qi-text small{ color:var(--muted); font-size:11.5px; }

        @media (max-width:991px){
            .sidebar{ width:72px; }
            .sidebar-brand .name, .sidebar-nav a span, .nav-section, .sidebar-foot{ display:none; }
            .sidebar-nav a{ justify-content:center; }
            .main{ margin-left:72px; }
            .topbar-search{ display:none; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="crest"><i class="fa-solid fa-staff-snake"></i></div>
            <div class="name">MMT Medical<br>College
                <small>Admin Panel</small>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">Overview</div>

            <a href="#"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>

            <div class="nav-section">People</div>
            <a href="{% url 'admin_student_list' %}"><i class="fa-solid fa-user-graduate"></i><span>Students</span></a>
            <a href="{% url 'staff_list' %}"><i class="fa-solid fa-user-tie"></i><span>Staff</span></a>
            <a href="{% url 'college_list' %}"><i class="fa-solid fa-building-columns"></i><span>Colleges</span></a>
             <a href="{% url 'department_list' %}"><i class="fa-solid fa-layer-group"></i></i><span> Departments</span></a>

            <div class="nav-section">Admissions</div>
            <a href="#"><i class="fa-solid fa-file-signature"></i><span>Applications</span></a>
            <a href="#"><i class="fa-solid fa-clipboard-check"></i><span>Approvals</span></a>

            <div class="nav-section">System</div>
            <a href="#"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
            <a href="{% url 'logout_b' %}"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </nav>

        <div class="sidebar-foot">
            v1.0 &middot; Admin Console
        </div>
    </aside>

    <!-- Main -->
    <div class="main">

        <header class="topbar">
            <div>
                <h4>Dashboard</h4>
                <p class="breadcrumb-note">Overview of admissions, staff and colleges</p>
            </div>


            <div class="topbar-actions">
                <div class="icon-btn"><i class="fa-regular fa-bell"></i><span class="dot"></span></div>
                <div class="icon-btn"><i class="fa-regular fa-envelope"></i></div>
                <div class="admin-chip">
                    <div class="avatar">A</div>
                    <div class="who">

                        <small>{{request.user}}</small>
                    </div>

                </div>
            </div>
        </header>

        <main class="content">

<div class="row g-3 mb-4">
                <!-- Enrollment chart -->
                <div class="col-lg-12">
                    <div class="panel h-100">

                      {% block content %}




                      {% endblock %}


                        </div>

                </div>


        </main>
    </div>

</body>
</html>
